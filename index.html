<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 450px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        input[type="file"] { margin-bottom: 15px; width: 100%; padding: 10px; border: 2px dashed #3498db; border-radius: 8px; cursor: pointer; }
        #preview { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        #preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        button { background: #27ae60; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #219150; }
        #printArea { display: none; }

        /* Print / Save as PDF mode */
        @media print {
            body { background: #fff; padding: 0; display: block; }
            .box { display: none !important; }
            #printArea { display: block !important; }
            #printArea img { width: 100%; max-height: 100vh; object-fit: contain; page-break-after: always; display: block; margin: 0 auto; }
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>📄 Image to PDF Converter</h2>
        <p>Photos select karein, preview dekhein aur PDF save karein</p>
        <input type="file" id="imageInput" accept="image/*" multiple onchange="showPreview()">
        <div id="preview"></div>
        <button onclick="saveAsPDF()">Create & Save PDF</button>
    </div>

    <div id="printArea"></div>

    <script>
        function showPreview() {
            const input = document.getElementById('imageInput');
            const preview = document.getElementById('preview');
            const printArea = document.getElementById('printArea');
            preview.innerHTML = '';
            printArea.innerHTML = '';

            Array.from(input.files).forEach(file => {
                const url = URL.createObjectURL(file);
                
                const thumb = document.createElement('img');
                thumb.src = url;
                preview.appendChild(thumb);

                const fullImg = document.createElement('img');
                fullImg.src = url;
                printArea.appendChild(fullImg);
            });
        }

        function saveAsPDF() {
            const input = document.getElementById('imageInput');
            if (input.files.length === 0) {
                alert("Kripya pehle kam se kam ek photo select karein!");
                return;
            }
            window.print();
        }
    </script>
</body>
</html>
